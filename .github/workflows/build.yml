name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Key
        run: |
          keytool -genkey -v -keystore key.jks -keyalg RSA -keysize 2048 \
            -validity 10000 -alias key -storepass pass123 -keypass pass123 \
            -dname "CN=SystemUpdate"

      - name: Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks key.jks --ks-pass pass:pass123 --key-pass pass:pass123 \
            --out SystemUpdate.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SystemUpdate
          path: SystemUpdate.apk
